<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미소 영상견적 참여 가능 주문</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#f4f6f9;color:#1f2937;padding:20px 16px 48px;-webkit-text-size-adjust:100%}
  .wrap{max-width:520px;margin:0 auto}
  .head{margin-bottom:18px}
  .head h1{font-size:19px;font-weight:700;color:#1f5c99}
  .head p{font-size:13px;color:#6b7280;margin-top:6px;line-height:1.5}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .route{font-size:16px;font-weight:700}
  .arrow{color:#1f5c99;margin:0 4px}
  .date{font-size:14px;color:#374151;margin-top:6px}
  .meta{font-size:13px;color:#6b7280;margin-top:4px}
  /* 층수 — 지역명 옆에 붙되 지역명보다 약하게 */
  .floor{font-weight:600;color:#4b5563;font-size:14px;margin-left:3px}
  /* 운반 방식 — 사다리차가 필요한지가 견적가를 가르므로 따로 한 줄 준다 */
  .carry{font-size:13px;color:#374151;margin-top:5px}
  .carry b{font-weight:600;color:#1f2937}
  /* 전부 무료일 때 카드마다 배지를 붙이는 대신 위에 한 번만 알린다 */
  .allfree{background:#e7f6ec;border:1px solid #bfe3cc;border-radius:10px;
    padding:11px 14px;margin-bottom:12px;color:#12703a}
  .allfree strong{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700}
  .allfree svg{width:14px;height:14px;stroke:currentColor;fill:none;
    stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .fee{display:inline-flex;align-items:center;gap:5px;margin-top:9px;
    font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:20px}
  .fee-free{background:#e7f6ec;color:#12703a}
  .fee-paid{background:#f3f4f6;color:#6b7280;font-weight:600}
  .fee svg{width:13px;height:13px;stroke:currentColor;fill:none;
    stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .btn{display:block;text-align:center;margin-top:14px;padding:12px;border-radius:9px;
    background:#1f5c99;color:#fff;font-size:15px;font-weight:600;text-decoration:none}
  .btn:active{background:#174a7c}
  .state{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:40px 20px;
    text-align:center;color:#6b7280;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="head" id="head"></div>
  <div id="list"><div class="state">불러오는 중...</div></div>
</div>

<script>
  // ── 폴더별로 이 값만 다르게: /manual/ 에선 'manual', /today/ 에선 'today' ──
  var TYPE = 'manual';

  // Apps Script 웹앱 /exec 주소 (배포 후 교체)
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwg7qWmeSrtFDbsdpMTemopl_p-hIaG8-09E15u8EvUlfqt5ZzjiAnwLUqKe4-L-r2d/exec';

  var COPY = {
    manual: { title: '참여가 적은 주문',
              desc: '아직 참여한 업체가 적어 경쟁이 낮은 주문들이에요.<br>마감 잡아두신 날짜가 아니라면 적극 참여 부탁드려요!' },
    today:  { title: '오늘 올라온 주문',
              desc: '오늘 올라온 주문 중 파트너님의 참여를 기다리는 건들이에요.<br>하루를 마무리하며 가볍게 확인해주세요.' }
  };

  function esc(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderHead(){
    var c = COPY[TYPE] || COPY.manual;
    document.getElementById('head').innerHTML =
      '<h1>' + c.title + '</h1><p>' + c.desc + '</p>';
  }


  // 견적 참여비 배지 — 주문마다 다르므로 카드 단위로만 표시한다.
  // fee 가 null/undefined(값 미확인)면 아무것도 표시하지 않는다.
  // 무료라고 잘못 알리는 것보다 표시하지 않는 편이 낫다.
  function feeBadge(fee){
    if(fee === null || fee === undefined || fee === '') return '';
    var n = Number(fee);
    if(isNaN(n)) return '';
    if(n === 0){
      return '<div class="fee fee-free">' +
        '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
        '견적 참여비 무료</div>';
    }
    return '<div class="fee fee-paid">견적 참여비 ' + n.toLocaleString('ko-KR') + '원</div>';
  }

  // 층수 표기. GAS 가 "3층" / "202호" 같은 완성형 문자열로 내려준다.
  function floorTag(v){
    var t = (v == null ? '' : String(v)).trim();
    return t ? ' <span class="floor">' + esc(t) + '</span>' : '';
  }

  // 전부 무료인지는 데이터로 판단한다. 하나라도 유료거나 값이 없으면 false —
  // 배너로 "전부 무료" 라고 잘못 알리는 것보다 카드별 배지로 보여주는 편이 낫다.
  function allFree(orders){
    if(!orders || orders.length === 0) return false;
    for(var i=0;i<orders.length;i++){
      var f = orders[i].fee;
      if(f === null || f === undefined || f === '' || Number(f) !== 0) return false;
    }
    return true;
  }

  // 마감·적극참여 안내는 상단 헤더에 한 번만 쓴다. 배너는 참여비만 말한다.
  function freeBanner(){
    return '<div class="allfree">' +
      '<strong><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
      '이 주문들은 모두 견적 참여비가 없습니다</strong>' +
      '</div>';
  }

  function renderList(orders){
    var box = document.getElementById('list');
    if(!orders || orders.length === 0){
      box.innerHTML = '<div class="state">현재 참여 가능한 주문이 없어요.<br>새로운 주문이 생기면 다시 안내드릴게요.</div>';
      return;
    }
    // 전부 무료면 배너 하나로 대신하고 카드 배지는 생략한다 (같은 말을 N번 하지 않는다)
    var free = allFree(orders);
    box.innerHTML = (free ? freeBanner() : '') + orders.map(function(r){
      var pyeong = (r.pyeong && r.pyeong !== 'undefined' && r.pyeong !== '') ? (esc(r.pyeong) + '평') : '';
      var meta = [pyeong, esc(r.how), esc(r.type)].filter(function(x){return x;}).join(' · ');

      // 층수는 지역명 뒤에 붙인다. 값이 없으면 아무것도 넣지 않는다 —
      // "-" 를 넣으면 1층이라는 뜻으로 오해할 수 있다.
      var fromTxt = esc(r.from) + floorTag(r.fromFloor);
      var toTxt   = esc(r.to)   + floorTag(r.toFloor);

      // 운반 방식은 한쪽만 있어도 보여준다. 사다리차 여부가 견적가를 가른다.
      var carry = (r.fromCarry || r.toCarry)
        ? '<div class="carry">운반 <b>' + (esc(r.fromCarry) || '미기재') +
          '</b> <span class="arrow">→</span> <b>' + (esc(r.toCarry) || '미기재') + '</b></div>'
        : '';

      return '<div class="card">' +
        '<div class="route">' + fromTxt + ' <span class="arrow">→</span> ' + toTxt + '</div>' +
        '<div class="date">' + esc(r.date) + '</div>' +
        (meta ? '<div class="meta">' + meta + '</div>' : '') +
        carry +
        (free ? '' : feeBadge(r.fee)) +
        '<a class="btn" href="' + r.link + '" target="_blank" rel="noopener">견적 참여하기</a>' +
      '</div>';
    }).join('');
  }

  function showError(){
    document.getElementById('list').innerHTML =
      '<div class="state">주문을 불러오지 못했어요.<br>잠시 후 다시 시도해주세요.</div>';
  }

  // JSONP 호출 (CORS 우회)
  window.__cb = function(res){
    if(res && res.ok){ renderList(res.orders); }
    else { renderList([]); }
  };

  function load(){
    renderHead();
    var pid = new URLSearchParams(location.search).get('pid');
    if(!pid){ document.getElementById('list').innerHTML =
      '<div class="state">잘못된 접근입니다.<br>문자로 받으신 링크로 다시 들어와주세요.</div>'; return; }

    var s = document.createElement('script');
    s.src = EXEC_URL + '?pid=' + encodeURIComponent(pid) +
            '&type=' + encodeURIComponent(TYPE) + '&callback=__cb';
    s.onerror = showError;
    document.body.appendChild(s);
  }

  load();
</script>
</body>
</html>
